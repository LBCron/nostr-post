name: CI

# Lint, build, type-check and test every pull request and every push to main, so a change
# (including a Dependabot update) shows whether the project still builds and its tests pass.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json's packageManager
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Before typecheck and tests: packages import their siblings' built dist/
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
