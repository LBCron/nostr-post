name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional Web3Auth client ID for nostr-shard-signer (adds Google/Apple/X sign-in to the
      # examples and manifest creator; without it they offer Nostr-only sign-in). Set it as a
      # repository variable (not on the github-pages environment: this build job doesn't use it)
      # and register it for https://saintego.github.io at https://saintego.github.io/nostr-shard-signer/portal/
      VITE_WEB3AUTH_CLIENT_ID: ${{ vars.WEB3AUTH_CLIENT_ID }}
      NEXT_PUBLIC_WEB3AUTH_CLIENT_ID: ${{ vars.WEB3AUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      # The same site as the PR previews (scripts/build-pages-preview.mjs: packages, CDN bundle,
      # every example and the manifest creator), under GitHub Pages' /nostr-post/ path
      - run: pnpm build:pages
        env:
          PAGES_BASE_PATH: /nostr-post

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-local

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
